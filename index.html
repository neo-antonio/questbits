<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuestBits</title>
<meta name="theme-color" content="#ebe4d0" id="tc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400;500;700&family=Cinzel:wght@600;700&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--r:18px;--warn:#fde047;--org:#fb923c;--bad:#fb7185;--on:#032}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Ubuntu Sans',system-ui,sans-serif;transition:background .3s,color .3s}
body{display:flex;flex-direction:column;max-width:600px;margin:auto;padding-top:env(safe-area-inset-top)}
header{position:relative;z-index:3;padding:8px 16px 4px;background:var(--bg)}header::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.hi{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.lv{flex:none;width:38px;height:38px;border-radius:12px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:17px}
.xp{flex:1;min-width:0}.xt{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.xt span:first-child{color:var(--tx);font-weight:500}
.coin{flex:none;font-weight:700;background:var(--card2);padding:7px 11px;border-radius:99px;font-size:14px}
.hi .bar{margin:5px 0 0;height:6px}
main{flex:1;overflow-y:auto;padding:14px 16px 110px}
.tab{display:none}.tab.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;margin:6px 0 16px;font-weight:700;letter-spacing:-.4px}
h2{font-size:15px;margin:28px 0 12px;color:var(--mu);font-weight:500}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;display:flex;background:var(--card);box-shadow:0 -4px 20px #0003;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav button.on{color:var(--ac);font-weight:500}nav button.on svg{transform:translateY(-2px) scale(1.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips.w{flex-wrap:wrap}
.chip{flex:none;border:0;background:var(--card);color:var(--mu);border-radius:99px;padding:8px 15px;font:inherit;font-size:14px;transition:.2s;box-shadow:var(--sh)}
.chip.on{background:var(--ac);color:var(--on);font-weight:500}
input,select{width:100%;background:var(--card);border:1.5px solid var(--card2);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:15px;outline:0;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:16px 0 7px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--sh);animation:in .25s ease}
.card.miss{box-shadow:inset 3px 0 var(--bad),var(--sh)}.card.lock{opacity:.6}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0;cursor:pointer}.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mu);margin-top:3px}
.tg{display:inline-block;font-size:11px;background:var(--card2);border-radius:99px;padding:2px 9px;margin:5px 4px 0 0;color:var(--ac)}
.st{font-size:11px;border-radius:6px;padding:2px 7px;margin-right:6px;background:var(--card2)}
.st.training{color:var(--warn)}.st.complete{color:var(--ac)}.st.review{color:var(--org)}
.ck{flex:none;min-width:50px;height:50px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font:inherit;font-size:13px;font-weight:700;transition:.2s}
.ck.done{background:var(--ac);color:var(--on);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:500;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}.btn.g{background:var(--card2);color:var(--tx)}.btn.d{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}.btn[disabled]{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:92px;width:58px;height:58px;border-radius:20px;font-size:30px;border:0;background:var(--ac);color:var(--on);box-shadow:0 8px 22px #0005;z-index:4;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.empty{text-align:center;color:var(--mu);padding:44px 10px;line-height:1.6}
.modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex;animation:fade .2s}.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60%)}}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.igrid button{padding:0;min-width:0;aspect-ratio:1;border-radius:10px;border:2px solid transparent;background:var(--card);font-size:20px}.igrid button.on{border-color:var(--ac)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto}
.hm i{width:14px;height:14px;border-radius:3px;background:var(--card2)}
.hm i.l1{background:color-mix(in srgb,var(--ac) 35%,var(--card2))}.hm i.l2{background:color-mix(in srgb,var(--ac) 70%,var(--card2))}.hm i.l3{background:var(--ac)}.hm i.x{background:color-mix(in srgb,var(--bad) 45%,var(--card2))}
.pw{width:100%;accent-color:var(--ac)}
.bar{height:8px;background:var(--card2);border-radius:9px;position:relative;margin:12px 0 4px}.bar div{height:100%;background:var(--ac);border-radius:9px;transition:width .4s}.bar u{position:absolute;top:-4px;width:2px;height:16px;background:var(--warn)}
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}.me .ic{width:60px;height:60px;border-radius:20px;background:var(--ac);color:var(--on)}.me svg{width:32px;height:32px}
.fb{position:relative;background:var(--card);box-shadow:var(--sh);border:0;color:var(--tx);border-radius:12px;padding:12px 16px;font:inherit;display:flex;gap:8px;align-items:center}.fb svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ac);color:var(--on);font-weight:500;padding:10px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.sec{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.sec>h2{margin:0 0 14px;color:var(--tx);font-size:16px;font-weight:700}.sec h2+label{margin-top:0}
.sec .chip{background:var(--card2);box-shadow:none}.sec .chip.on{background:var(--ac)}
.sec input,.sec select{background:var(--bg)}.sec .card{background:var(--card2);box-shadow:none}.sec .card .ic{background:var(--card)}.sec .card .btn.g{background:var(--card)}
.sec .tg{background:var(--card2)}.note{font-size:13px;color:var(--mu);margin:0 0 20px;line-height:1.5}
.me{margin-bottom:16px}
.fx h1,.fx h2,.fx .lv,.fx .me .nm{font-family:Cinzel,'Ubuntu Sans',serif}
.fx h1{letter-spacing:.5px}.fx h1::after{content:"";display:block;width:64px;height:3px;margin-top:8px;background:linear-gradient(90deg,var(--ac),transparent);border-radius:3px}
.fx .card,.fx .sec,.fx .hi,.fx .me{border:1.5px solid color-mix(in srgb,var(--ac) 30%,transparent);border-radius:12px}
.fx .sec .card{border-color:color-mix(in srgb,var(--ac) 20%,transparent)}
.fx .lv{height:44px;border-radius:0;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);padding-bottom:6px}
.fx .ic{border-radius:10px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 40%,transparent)}
.fx .btn,.fx .chip,.fx input,.fx select{border-radius:10px}.fx nav{border-top:2px solid color-mix(in srgb,var(--ac) 35%,transparent)}.fx .fab{border-radius:50%}
.chip,.st,.tg,.xt span:last-child{text-transform:capitalize}.ic svg{width:50%;height:50%}.cn{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;stroke-width:1.5}
.me .grow{cursor:default}
.fx,.fx body{font-family:Alegreya,Georgia,'Times New Roman',serif}.fx body{font-size:17px}.fx .sub{font-size:13.5px}.fx .chip,.fx .btn,.fx input,.fx select{font-size:15.5px}.fx nav button{font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hd"></header>
<main>
 <section class="tab on" id="t0"></section>
 <section class="tab" id="t1"></section>
 <section class="tab" id="t2"></section>
</main>
<button class="fab" id="fab" onclick="edit()" aria-label="Add habit">+</button>
<nav>
 <button class="on" onclick="go(0)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>List</span></button>
 <button onclick="go(1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>Habits</span></button>
 <button onclick="go(2)"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Profile</span></button>
</nav>
<div class="modal" id="md" onclick="if(event.target==this)closeM()"><div class="sheet" id="sh"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="imp" hidden>
<script>
const K='atomic.v1',$=s=>document.querySelector(s);
const ICONS='💪 🏃 🧘 📖 💧 🥗 😴 🪥 🚿 🧹 ✍️ 🎯 🧠 💰 📵 🌅 🚶 🚴 🏊 🎸 🎨 💻 📞 🌱 🙏 🍎 🚭 ☀️ 🛏️ 🗣️ ⏰ 🧴 🦷 🫁 🏛️ 📝 🧘‍♂️ ❤️ 🔥 ⭐'.split(' ');
const THEMES={Teal:174,Forest:140,Ocean:200,Jade:158};
const COIN='<svg class="cn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5b83d" stroke="#a8680f"/><circle cx="12" cy="12" r="6.6" fill="#fbd36b" stroke="#a8680f"/><path d="M12 8 16 12 12 16 8 12Z" fill="#a8680f" stroke="none"/></svg>';
const cap=t=>t?t[0].toUpperCase()+t.slice(1):'';
const UI='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const def=()=>({habits:[],tags:['hygiene','health','fitness','mind','work','social'],theme:'Ocean',mode:'light',fx:true,game:{on:true,coins:0,exp:0,per:100},shop:[],owned:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))||def()}catch{S=def()}
S={...def(),...S};S.game={...def().game,...S.game};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const dt=s=>new Date(s+'T12:00:00');
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((dt(a)-dt(b))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=id=>S.habits.find(h=>h.id==id);
const live=h=>h.status=='training'||h.status=='review';
let tab=0,lf={st:'all',kind:'all',tag:'all',q:''},hv='active',hmId=null,draft=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function applyTheme(){const h=THEMES[S.theme]||200,fx=S.fx!==false;let m=S.mode||'light';if(m=='system')m=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
 const d=m=='dark';let v=d?{bg:`hsl(${h} 55% 7%)`,card:`hsl(${h} 42% 12%)`,card2:`hsl(${h} 38% 19%)`,ac:`hsl(${h} 70% 55%)`,on:`hsl(${h} 80% 8%)`,tx:`hsl(${h} 60% 94%)`,mu:`hsl(${h} 18% 63%)`,sh:'0 4px 14px #0005',warn:'#fde047',org:'#fb923c',bad:'#fb7185'}
 :{bg:`hsl(${h} 30% 95%)`,card:'#fff',card2:`hsl(${h} 28% 90%)`,ac:`hsl(${h} 85% 26%)`,on:'#fff',tx:`hsl(${h} 45% 10%)`,mu:`hsl(${h} 14% 38%)`,sh:`0 2px 10px hsl(${h} 30% 30%/.13)`,warn:'#a16207',org:'#c2410c',bad:'#be123c'};
 if(fx)v=d?{...v,bg:'hsl(28 22% 8%)',card:'hsl(28 20% 13%)',card2:'hsl(28 18% 20%)',tx:'hsl(40 45% 92%)',mu:'hsl(36 15% 64%)'}:{...v,bg:'hsl(40 40% 89%)',card:'hsl(42 55% 95%)',card2:'hsl(38 35% 84%)',tx:'hsl(28 40% 14%)',mu:'hsl(30 18% 34%)',sh:'0 2px 10px hsl(30 40% 30%/.16)'};
 const r=document.documentElement.style;for(const k in v)r.setProperty('--'+k,v[k]);r.colorScheme=m;$('#tc').content=v.bg}
const G=()=>S.game.on;
function lv(){const p=S.game.per||100,e=S.game.exp;return{l:Math.floor(e/p)+1,cur:e%p,p}}
function give(c,x){if(!G())return;const a=lv().l;S.game.coins=Math.max(0,S.game.coins+c);S.game.exp=Math.max(0,S.game.exp+x);const b=lv().l;
 if(c>0||x>0)toast(`+${c} coins · +${x} exp`+(b>a?` · Level ${b}!`:''))}
function hdr(){const e=$('#hd');if(!G()){e.style.display='none';return}const g=S.game,L=lv();e.style.display='';
 e.innerHTML=`<div class="hi"><div class="lv">${L.l}</div><div class="xp"><div class="xt"><span>Level ${L.l}</span><span>${L.cur} / ${L.p} exp</span></div><div class="bar"><div style="width:${L.cur/L.p*100}%"></div></div></div><div class="coin">${COIN} ${g.coins}</div></div>`}
function go(i){tab=i;document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',i==j));document.querySelectorAll('nav button').forEach((e,j)=>e.classList.toggle('on',i==j));$('#fab').style.display=i==0?'':'none';render()}
function icon(h){return `<div class="ic">${h.img?`<img src="${esc(h.img)}" alt="">`:h.icon||'⭐'}</div>`}

/* ---- scheduling ---- */
const sc=h=>h.sched||{mode:'daily',count:1};
function dueOn(h,d){const s=sc(h);
 if(d<(h.since||'0'))return 0;
 if(s.mode=='daily')return s.count||1;
 if(s.mode=='days')return (s.days||[]).includes(dt(d).getDay())?1:0;
 if(s.mode=='every'){const k=diff(d,s.anchor||h.since||d);return k>=0&&k%(s.n||1)==0?1:0}
 return 0}
function weekStart(d){const x=dt(d),w=(x.getDay()+6)%7;return addD(d,-w)}
function items(){const t=today(),out=[];
 S.habits.filter(h=>h.type=='active'&&live(h)).forEach(h=>{const s=sc(h),L=h.logs||{};
  if(s.mode=='week'){const w=weekStart(t);let n=0;for(let i=0;i<7;i++)n+=L[addD(w,i)]||0;out.push({h,date:t,need:s.count||1,done:n,week:1});return}
  if(s.mode=='daily'){out.push({h,date:t,need:dueOn(h,t),done:L[t]||0});return}
  for(let i=0;i<120;i++){const d=addD(t,-i),n=dueOn(h,d);if(n){const done=L[d]||0;
    if(i==0||done<n)out.push({h,date:d,need:n,done,missed:i>0});break}}});
 return out.sort((a,b)=>(a.h.time?0:1)-(b.h.time?0:1)||(a.h.time||'').localeCompare(b.h.time||''))}
function tap(id,date){const h=get(id),it=items().find(i=>i.h.id==id),s=sc(h);h.logs=h.logs||{};h.paid=h.paid||{};
 const key=it.week?weekStart(date):date;
 if(it.done>=it.need){if(it.week){const w=weekStart(date);for(let i=0;i<7;i++)delete h.logs[addD(w,i)]}else delete h.logs[date];
  if(h.paid[key]){delete h.paid[key];give(-(h.coins||0),-(h.exp||0))}}
 else{h.logs[date]=(h.logs[date]||0)+1;
  if(it.done+1>=it.need){if(it.missed&&s.mode=='every'){s.anchor=today();toast('Schedule shifted to today')}
   if(!h.paid[key]){h.paid[key]=1;give(h.coins||0,h.exp||0)}}}
 save();render()}
function missedList(){const t=today(),out=[];
 S.habits.filter(h=>h.type=='active'&&live(h)).forEach(h=>{if(sc(h).mode=='week')return;
  for(let i=1;i<=14;i++){const d=addD(t,-i),n=dueOn(h,d);if(n&&(h.logs?.[d]||0)<n)out.push({h,d,n})}});return out}
function fix(id,d,n){const h=get(id);h.logs=h.logs||{};h.logs[d]=n;save();toast('Marked as done');render()}

/* ---- render ---- */
function chrome(){const g=G(),sp=document.querySelectorAll('nav span');sp[0].textContent=g?'Quests':'List';sp[1].textContent=g?'Adventure':'Habits';sp[2].textContent=g?'Shop':'Profile';
 document.querySelector('nav button:nth-child(3) svg').innerHTML=g?'<path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/>':'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>';document.documentElement.classList.toggle('fx',S.fx!==false)}
function render(){applyTheme();chrome();hdr();[renderList,renderHabits,renderProfile][tab]()}
const nF=()=>(lf.st!='all')+(lf.kind!='all')+(lf.tag!='all');
function renderList(){
 const hs=S.habits.filter(h=>(lf.st=='all'||h.status==lf.st)&&(lf.kind=='all'||h.type==lf.kind)&&(lf.tag=='all'||(h.tags||[]).includes(lf.tag))&&h.name.toLowerCase().includes(lf.q.toLowerCase()));
 const x=(k,l)=>lf[k]!='all'?`<button class="chip on" onclick="lf.${k}='all';renderList()">${esc(l||lf[k])} ✕</button>`:'';
 $('#t0').innerHTML=`<h1>${G()?'Quests':'All habits'}</h1>
 <div class="row" style="flex-wrap:nowrap;margin-bottom:10px"><input placeholder="Search habits" value="${esc(lf.q)}" oninput="lf.q=this.value;renderList();const i=$('#t0 input');i.focus();i.setSelectionRange(99,99)"><button class="fb" style="flex:none" onclick="openFilter()"><svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filter${nF()?' · '+nF():''}</button></div>
 ${nF()?`<div class="chips" style="margin-bottom:8px">${x('st')}${x('kind')}${x('tag')}</div>`:''}
 ${hs.length?hs.map(h=>`<div class="card" onclick="edit('${h.id}')">${icon(h)}<div class="grow"><div class="nm">${esc(h.name)}</div>
 <div class="sub"><span class="st ${h.status}">${h.status}</span>${cap(h.type)}${h.time&&h.type=='active'?' · '+h.time:''}${h.type=='passive'?` · ${h.pct||0}% / ${h.target||80}%`:''}</div>
 <div>${(h.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div></div></div>`).join(''):`<div class="empty">No habits match.<br>Tap + to add one.</div>`}`}
function openFilter(){const c=(k,v)=>`<button class="chip ${lf[k]==v?'on':''}" onclick="lf.${k}='${v}';openFilter();renderList()">${esc(v)}</button>`;
 $('#sh').innerHTML=`<h1>Filter</h1><label>Status</label><div class="chips w">${['all','pending','training','complete','review'].map(v=>c('st',v)).join('')}</div>
 <label>Kind</label><div class="chips w">${['all','active','passive'].map(v=>c('kind',v)).join('')}</div>
 <label>Tag</label><div class="chips w">${['all',...S.tags].map(v=>c('tag',v)).join('')}</div>

 const rows=S.habits.map(h=>CC.map(c=>q(c=='tags'?(h.tags||[]).join(';'):['sched','logs'].includes(c)?JSON.stringify(h[c]||{}):h[c])).join(','));
 dl('questbits-'+today()+'.csv',[CC.join(','),...rows].join('\n'),'text/csv')}
function parseCSV(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
 else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);R.push(r)}return R}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
 if(f.name.endsWith('.csv')){const [hd,...rows]=parseCSV(r.result).filter(x=>x.length>1);
  rows.forEach(v=>{const o={};hd.forEach((k,i)=>o[k]=v[i]);
   const h={...o,tags:o.tags?o.tags.split(';'):[],sched:JSON.parse(o.sched||'{}'),logs:JSON.parse(o.logs||'{}'),pct:+o.pct||0,target:+o.target||80};
   h.tags.forEach(t=>{if(!S.tags.includes(t))S.tags.push(t)});const i=S.habits.findIndex(x=>x.id==h.id);i<0?S.habits.push(h):S.habits[i]=h})}
 else{const j=JSON.parse(r.result);if(!Array.isArray(j.habits))throw 0;S={...def(),...j}}
 save();render();toast('Import complete')}catch{toast('Could not read that file')}e.target.value=''};r.readAsText(f)};

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
go(0);
</script>

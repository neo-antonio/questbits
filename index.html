<style>
:root{--r:18px;--warn:#fde047;--org:#fb923c;--bad:#fb7185;--on:#032}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Ubuntu Sans',system-ui,sans-serif;transition:background .3s,color .3s}
body{display:flex;flex-direction:column;max-width:600px;margin:auto;padding-top:env(safe-area-inset-top)}
header{position:relative;z-index:3;padding:8px 16px 4px;background:var(--bg)}header::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.hi{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.lv{flex:none;width:38px;height:38px;border-radius:12px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:17px}
.xp{flex:1;min-width:0}.xt{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.xt span:first-child{color:var(--tx);font-weight:500}
.coin{flex:none;font-weight:700;background:var(--card2);padding:7px 11px;border-radius:99px;font-size:14px}
.hi .bar{margin:5px 0 0;height:6px}
main{flex:1;overflow-y:auto;padding:14px 16px 110px}
.tab{display:none}.tab.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;margin:6px 0 16px;font-weight:700;letter-spacing:-.4px}
h2{font-size:15px;margin:28px 0 12px;color:var(--mu);font-weight:500}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;display:flex;background:var(--card);box-shadow:0 -4px 20px #0003;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav button.on{color:var(--ac);font-weight:500}nav button.on svg{transform:translateY(-2px) scale(1.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips.w{flex-wrap:wrap}
.chip{flex:none;border:0;background:var(--card);color:var(--mu);border-radius:99px;padding:8px 15px;font:inherit;font-size:14px;transition:.2s;box-shadow:var(--sh)}
.chip.on{background:var(--ac);color:var(--on);font-weight:500}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--card2);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:15px;outline:0;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:16px 0 7px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--sh);animation:in .25s ease}
.card.miss{box-shadow:inset 3px 0 var(--bad),var(--sh)}.card.lock{opacity:.6}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0;cursor:pointer}.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mu);margin-top:3px}
.tg{display:inline-block;font-size:11px;background:var(--card2);border-radius:99px;padding:2px 9px;margin:5px 4px 0 0;color:var(--ac)}
.st{font-size:11px;border-radius:6px;padding:2px 7px;margin-right:6px;background:var(--card2)}
.st.training{color:var(--warn)}.st.complete{color:var(--ac)}.st.review{color:var(--org)}
.ck{flex:none;min-width:50px;height:50px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font:inherit;font-size:13px;font-weight:700;transition:.2s}
.ck.done{background:var(--ac);color:var(--on);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:500;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}.btn.g{background:var(--card2);color:var(--tx)}.btn.d{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}.btn[disabled]{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:92px;width:58px;height:58px;border-radius:20px;font-size:30px;border:0;background:var(--ac);color:var(--on);box-shadow:0 8px 22px #0005;z-index:4;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.empty{text-align:center;color:var(--mu);padding:44px 10px;line-height:1.6}
.modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex;animation:fade .2s}.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60%)}}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.igrid button{padding:0;min-width:0;aspect-ratio:1;border-radius:10px;border:2px solid transparent;background:var(--card);font-size:20px}.igrid button.on{border-color:var(--ac)}
.pw{width:100%;accent-color:var(--ac)}
.bar{height:8px;background:var(--card2);border-radius:9px;position:relative;margin:12px 0 4px}.bar div{height:100%;background:var(--ac);border-radius:9px;transition:width .4s}.bar u{position:absolute;top:-4px;width:2px;height:16px;background:var(--warn)}
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}.me .ic{width:60px;height:60px;border-radius:20px;background:var(--ac);color:var(--on)}.me svg{width:32px;height:32px}
.fb{position:relative;background:var(--card);box-shadow:var(--sh);border:0;color:var(--tx);border-radius:12px;padding:12px 16px;font:inherit;display:flex;gap:8px;align-items:center}.fb svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ac);color:var(--on);font-weight:500;padding:10px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.sec{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.sec>h2{margin:0 0 14px;color:var(--tx);font-size:16px;font-weight:700}.sec h2+label{margin-top:0}
.sec .chip{background:var(--card2);box-shadow:none}.sec .chip.on{background:var(--ac)}
.sec input,.sec select{background:var(--bg)}.sec .card{background:var(--card2);box-shadow:none}.sec .card .ic{background:var(--card)}.sec .card .btn.g{background:var(--card)}
.sec .tg{background:var(--card2)}.note{font-size:13px;color:var(--mu);margin:0 0 20px;line-height:1.5}
.me{margin-bottom:16px}
.fx h1,.fx h2,.fx .lv,.fx .me .nm{font-family:Cinzel,'Ubuntu Sans',serif}
.fx h1{letter-spacing:.5px}.fx h1::after{content:"";display:block;width:64px;height:3px;margin-top:8px;background:linear-gradient(90deg,var(--ac),transparent);border-radius:3px}
.fx .card,.fx .sec,.fx .hi,.fx .me{border:1.5px solid color-mix(in srgb,var(--ac) 30%,transparent);border-radius:12px}
.fx .sec .card{border-color:color-mix(in srgb,var(--ac) 20%,transparent)}
.fx .lv{height:44px;border-radius:0;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);padding-bottom:6px}
.fx .ic{border-radius:10px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 40%,transparent)}
.fx .btn,.fx .chip,.fx input,.fx select,.fx textarea{border-radius:10px}.fx nav{border-top:2px solid color-mix(in srgb,var(--ac) 35%,transparent)}.fx .fab{border-radius:50%}
.chip,.st,.tg,.xt span:last-child{text-transform:capitalize}.ic svg{width:50%;height:50%}.cn{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;stroke-width:1.5}
.me .grow{cursor:default}
.fx,.fx body{font-family:Alegreya,Georgia,'Times New Roman',serif}.fx body{font-size:17px}.fx .sub{font-size:13.5px}.fx .chip,.fx .btn,.fx input,.fx select,.fx textarea{font-size:15.5px}.fx nav button{font-size:13px}
.top{display:flex;align-items:center;gap:12px}.top h1{margin:6px 0 16px}
.gear{flex:none;background:var(--card);border:0;color:var(--ac);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;box-shadow:var(--sh);margin-bottom:10px}.gear svg{width:22px;height:22px}
.boss{background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 16%,var(--card)),var(--card));border:1.5px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:in .25s ease}
.boss .bh{display:flex;gap:12px;align-items:center}.boss .ic{width:56px;height:56px}.st.bad{color:var(--bad)}
.ic{color:var(--mu)}
.ck svg{display:block;margin:auto;width:22px;height:22px}
.ds{font-size:13px;color:var(--mu);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.hero{width:min(100%,46vh);aspect-ratio:1/1;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--card2);display:grid;place-items:center;color:var(--mu)}.hero img{width:100%;height:100%;object-fit:cover}.hero svg{width:64px;height:64px}
.full{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:12px 0 0;color:var(--tx)}.full.none{color:var(--mu)}
.imgrow{display:flex;gap:12px;align-items:flex-start}.imgrow .ic{flex:none;width:72px;height:72px;border-radius:16px}
.hint{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.4}
textarea{resize:vertical;min-height:84px;line-height:1.4}
.gear{transition:transform .15s}.gear:active{transform:scale(.88)}.gear.bk:active svg{transform:translateX(-3px)}
.gear.spin:not(.bk) svg{animation:spin .45s ease-out}@keyframes spin{to{transform:rotate(90deg)}}
.nrow{display:flex;align-items:center;gap:8px}.nrow .nm{flex:1;min-width:0}.nrow .st{flex:none;margin:0}
.card .ic{align-self:center;flex:none;width:72px;height:72px;aspect-ratio:1/1;min-height:0;border-radius:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mini{height:5px;background:var(--card2);border-radius:9px;margin:8px 0 3px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ac);border-radius:9px}
.rw{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.rw .tg{margin:0}.rw .tg:first-of-type{margin-left:8px}
.act{flex:none;align-self:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh);min-width:0}.stat.w2{grid-column:1/-1}
.stat small{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}.stat b{display:block;font-weight:500;margin-top:3px;overflow-wrap:anywhere}.stat b.big{font-size:28px;font-weight:700}
.stat .bar{margin:8px 0 4px}
.row.sm .btn{padding:11px 6px}
.up{color:var(--ac)}.dn{color:var(--bad)}
.hn{font-size:13px;color:var(--mu);margin-top:3px;line-height:1.35;overflow-wrap:anywhere}
.card.q{display:block}.qh{display:flex;align-items:center;gap:12px}.card .qh .ic{align-self:center}
.qb{margin-top:10px}.qb>.mini:first-child{margin-top:0}.qf{display:flex;align-items:center;gap:10px}.qf>div{flex:1;min-width:0}.qf .act{padding:9px 18px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}.chiprow .st,.chiprow .tg{margin:0;font-size:12px;line-height:1.2;padding:5px 12px;border-radius:99px}.st.ty{color:var(--mu)}
.fx .hero+h1::after{display:none}
</style>

 :{bg:`hsl(${h} 30% 95%)`,card:'#fff',card2:`hsl(${h} 28% 90%)`,ac:`hsl(${h} 85% 26%)`,on:'#fff',tx:`hsl(${h} 45% 10%)`,mu:`hsl(${h} 14% 38%)`,sh:`0 2px 10px hsl(${h} 30% 30%/.13)`,warn:'#a16207',org:'#c2410c',bad:'#be123c'};
 if(fx)v={...v,bg:'hsl(40 40% 89%)',card:'hsl(42 55% 95%)',card2:'hsl(38 35% 84%)',tx:'hsl(28 40% 14%)',mu:'hsl(30 18% 34%)',sh:'0 2px 10px hsl(30 40% 30%/.16)'};

const G=()=>true;
const r2=n=>Math.round((+n||0)*100)/100,fmt=n=>String(r2(n));
function lv(){const p=S.game.per||100,e=S.game.exp;return{l:Math.floor(e/p)+1,cur:r2(e%p),p}}
function give(c,x,quiet,note){if(!G())return[0,0];const a=lv().l,c0=S.game.coins,x0=S.game.exp;S.game.coins=r2(Math.max(0,c0+c));S.game.exp=r2(Math.max(0,x0+x));const b=lv().l;
 if(!quiet&&(c>0||x>0))toast(`+${fmt(c)} coins · +${fmt(x)} exp`+(note||'')+(b>a?` · Level ${b}!`:''));return[r2(S.game.coins-c0),r2(S.game.exp-x0)]}
function dayStat(){const g=S.game,t=today();if(!g.day||g.day.d!=t)g.day={d:t,n:0,c:0};return g.day}
function mult(k){const D=S.game.dim;if(!D.on)return 1;const f=Math.max(0,Math.floor(+D.free)||0);if(k<=f)return 1;return Math.max(Math.min(100,+D.floor||0)/100,Math.pow(Math.min(100,+D.rate||0)/100,k-f))}
function earn(c,x,quiet){const D=S.game.dim,d=dayStat(),m=mult(d.n+1),cnt=c>0||x>0;if(!cnt)return[0,0,'',0];
 let c2=r2(c*m),x2=r2(x*m),cap=false;
 if(D.on!==false&&+D.cap>0){const left=Math.max(0,r2(D.cap-d.c));if(c2>left){c2=left;cap=true}}
 const info=cap?' · daily coin cap reached':m<1?` · ${Math.round(m*100)}% (diminishing)`:'';
 const r=give(c2,x2,quiet,info);d.n++;d.c=r2(d.c+r[0]);return[r[0],r[1],info,1]}
function refund(h,key){const p=h.pay?.[key];let c,x,t=null;if(p){[c,x,t]=p;delete h.pay[key]}else{c=h.coins||0;x=h.exp||0}
 give(-c,-x,1);if(t==today()){const d=dayStat();d.n=Math.max(0,d.n-1);d.c=Math.max(0,r2(d.c-c))}}
function refundQ(h,key,done){const q=h.qpay?.[key];let c,x,n=0,t=null;if(q){[c,x,n,t]=q;delete h.qpay[key]}else{c=done*(h.qty.coins||0);x=done*(h.qty.exp||0)}
 give(-c,-x,1);if(t==today()){const d=dayStat();d.n=Math.max(0,d.n-n);d.c=Math.max(0,r2(d.c-c))}}

/* ---- scheduling ---- */
const sc=h=>h.sched||{mode:'daily',count:1};
function dueOn(h,d){const s=sc(h),q=h.qty?.on?h.qty.target:0;
 if(d<(h.since||'0'))return 0;
 if(s.mode=='daily')return q||s.count||1;
 if(s.mode=='days')return (s.days||[]).includes(dt(d).getDay())?(q||1):0;
 if(s.mode=='every'){const k=diff(d,s.anchor||h.since||d);return k>=0&&k%(s.n||1)==0?(q||1):0}
 return 0}
function weekStart(d){const x=dt(d),w=(x.getDay()+6)%7;return addD(d,-w)}
function items(){const t=today(),out=[];
 S.habits.filter(h=>h.type=='active'&&live(h)).forEach(h=>{const s=sc(h),L=h.logs||{};
  if(s.mode=='week'){const w=weekStart(t);let n=0;for(let i=0;i<7;i++)n+=L[addD(w,i)]||0;out.push({h,date:t,need:h.qty?.on?h.qty.target:s.count||1,done:n,week:1});return}
  if(s.mode=='daily'){out.push({h,date:t,need:dueOn(h,t),done:L[t]||0});return}
  for(let i=0;i<120;i++){const d=addD(t,-i),n=dueOn(h,d);if(n){const done=L[d]||0;
    if(i==0||done<n)out.push({h,date:d,need:n,done,missed:i>0});break}}});
 return out.sort((a,b)=>(a.h.time?0:1)-(b.h.time?0:1)||(a.h.time||'').localeCompare(b.h.time||''))}
function mark(h,key,on){h.paid=h.paid||{};
 if(on&&!h.paid[key]){h.paid[key]=1;h.comp=(h.comp||0)+1;if(h.goal&&h.comp>=h.goal&&h.status!='complete'){h.status='complete';toast('Habit mastered! Moved to Complete')}}
 else if(!on&&h.paid[key]){delete h.paid[key];h.comp=Math.max(0,(h.comp||0)-1)}}
function tap(id,date){const h=get(id);if(h.qty?.on)return openQty(id,date);const it=items().find(i=>i.h.id==id),s=sc(h);h.logs=h.logs||{};h.paid=h.paid||{};
 const key=it.week?weekStart(date):date;
 if(it.done>=it.need){if(it.week){const w=weekStart(date);for(let i=0;i<7;i++)delete h.logs[addD(w,i)]}else delete h.logs[date];
  if(h.paid[key]){refund(h,key);mark(h,key,false)}}
 else{h.logs[date]=(h.logs[date]||0)+1;
  if(it.done+1>=it.need){if(it.missed&&s.mode=='every'){s.anchor=today();toast('Schedule shifted to today')}
   if(!h.paid[key]){const r=earn(h.coins||0,h.exp||0);(h.pay=h.pay||{})[key]=[r[0],r[1],today()];mark(h,key,true)}}}
 save();render()}
let qd={};
function openQty(id,date){qd={id,date,amt:1};const h=get(id),it=items().find(i=>i.h.id==id),u=esc(h.qty.unit||'units');
 $('#sh').innerHTML=`<h1>${esc(h.name)}</h1><p class="note">${it.done} of ${it.need} ${u} done · each one earns ${COIN} ${h.qty.coins||0} and ${h.qty.exp||0} exp</p>
 <label>How many ${u} did you complete?</label><input type="number" min="1" value="1" oninput="qd.amt=+this.value">
 <div class="row" style="margin-top:22px"><button class="btn d" onclick="resetQty()">Reset</button><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="addQty()">Add</button></div>`;$('#md').classList.add('on')}
function addQty(){const h=get(qd.id),a=Math.floor(qd.amt),it=items().find(i=>i.h.id==h.id);if(!(a>0))return toast('Enter an amount');
 h.logs=h.logs||{};const key=it.week?weekStart(qd.date):qd.date;h.logs[qd.date]=(h.logs[qd.date]||0)+a;const r=earn(a*(h.qty.coins||0),a*(h.qty.exp||0)),q=(h.qpay=h.qpay||{})[key]||[0,0,0,''];h.qpay[key]=[r2(q[0]+r[0]),r2(q[1]+r[1]),q[2]+r[3],today()];
 if(it.done<it.need&&it.done+a>=it.need){const s=sc(h);if(it.missed&&s.mode=='every')s.anchor=today();mark(h,key,true)}
 save();closeM();render()}
function resetQty(){const h=get(qd.id),it=items().find(i=>i.h.id==h.id),key=it.week?weekStart(qd.date):qd.date;
 refundQ(h,key,it.done);if(it.week){const w=weekStart(qd.date);for(let i=0;i<7;i++)delete h.logs[addD(w,i)]}else delete h.logs[qd.date];
 mark(h,key,false);save();closeM();render()}
function missedList(){const t=today(),out=[];
 S.habits.filter(h=>h.type=='active'&&live(h)).forEach(h=>{if(sc(h).mode=='week')return;
  for(let i=1;i<=14;i++){const d=addD(t,-i),n=dueOn(h,d);if(n&&(h.logs?.[d]||0)<n)out.push({h,d,n})}});return out}

function renderHabits(){

function bossProg(b){const h=b.hid&&get(b.hid);if(!h)return b.prog||0;let n=0;const t=today();for(let d=b.start;d<=b.end&&d<=t;d=addD(d,1))n+=h.logs?.[d]||0;return n}

 if(bossProg(b)>=b.target){b.state='won';b.done=t;give(b.coins||0,b.exp||0);c=1}else if(t>b.end){b.state='failed';b.done=t;c=1}});if(c)save()}
function bossPins(){const t=today();return S.bosses.filter(b=>b.state=='active'&&b.start<=t).map(b=>{const p=bossProg(b),left=diff(b.end,t)+1;
 return `<div class="boss"><div class="bh">${icon(b)}<div class="grow" onclick="openBossView('${b.id}')"><div class="nm">${esc(b.name)}</div>${b.desc?`<div class="ds">${esc(b.desc)}</div>`:''}<div class="sub">Boss battle · ${left} day${left>1?'s':''} left${b.hid?' · tracks '+esc(get(b.hid)?.name||'a habit'):''}</div></div>${b.hid?'':`<button class="btn" onclick="openBL('${b.id}')">Log</button>`}</div>
 <div class="bar"><div style="width:${Math.min(100,p/b.target*100)}%"></div></div><div class="sub">${p} / ${b.target} ${esc(b.unit||'')} · Reward ${COIN} ${b.coins||0} · ${b.exp||0} exp</div></div>`}).join('')}

 const cell=(l,v,w)=>`<div class="stat${w?' w2':''}"><small>${l}</small><b>${v}</b></div>`;let c='';

 const pri=h.status=='pending'?`<button class="btn" style="width:100%;margin-top:18px" onclick="if(accept('${h.id}'))closeM()">Accept quest · start fighting</button>`:h.status=='complete'?`<button class="btn" style="width:100%;margin-top:18px" onclick="if(retake('${h.id}'))closeM()">Retake quest</button>`:'';

 $('#sh').innerHTML=`<div class="hero">${thumb(h.img)}</div><h1 style="margin:16px 0 6px">${esc(h.name)}</h1>

 $('#sh').innerHTML=`<div class="hero">${thumb(b.img)}</div><h1 style="margin:16px 0 6px">${esc(b.name)}</h1>

 <div class="sub">Reward: ${COIN} ${b.coins||0} · ${b.exp||0} exp</div>

 $('#sh').innerHTML=`<h1>${d.isNew?'New habit':'Edit habit'}</h1>
 <label>Name</label><input id="en" value="${esc(d.name)}" oninput="draft.name=this.value">
 <label>Description (optional)</label><textarea rows="3" placeholder="What is this quest about?" oninput="draft.desc=this.value">${esc(d.desc)}</textarea>
 ${imgBlock(draft,'draft')}

 ${a&&L?`<label>How often</label><select onchange="draft.sched.mode=this.value;drawEd()">

  <label>Track as</label><div class="chips">${tog("(draft.qty=draft.qty||{}).on=false;drawEd()",!d.qty?.on,'Check')}${tog("draft.qty=draft.qty||{};draft.qty.on=true;draft.qty.target=draft.qty.target||5;if(draft.qty.coins==null)draft.qty.coins=1;if(draft.qty.exp==null)draft.qty.exp=2;drawEd()",!!d.qty?.on,'Amount')}</div>
  ${d.qty?.on?`<div class="row"><div><label>Target per occurrence</label><input type="number" min="1" value="${d.qty.target||5}" oninput="draft.qty.target=Math.max(1,+this.value||1)"></div><div><label>Unit</label><input value="${esc(d.qty.unit||'')}" placeholder="pages" oninput="draft.qty.unit=this.value"></div></div><div class="row"><div><label>Coins per unit</label><input type="number" min="0" step="any" value="${d.qty.coins??1}" oninput="draft.qty.coins=+this.value||0"></div><div><label>Exp per unit</label><input type="number" min="0" step="any" value="${d.qty.exp??2}" oninput="draft.qty.exp=+this.value||0"></div></div>`:''}
  <label>Auto-complete after X completions (optional)</label><input type="number" min="0" value="${d.goal||''}" placeholder="Leave empty to keep fighting" oninput="draft.goal=Math.max(0,+this.value||0)">`:''}
 ${!a?`<div class="row"><div><label>Mastery now (%)</label><input type="number" min="0" max="100" value="${d.pct||0}" oninput="draft.pct=Math.min(100,Math.max(0,+this.value||0))"></div><div><label>Passing percent</label><input type="number" min="1" max="100" value="${d.target||80}" oninput="draft.target=Math.min(100,Math.max(1,+this.value||80))"></div></div><div class="hint">Later changes go through Add / Reduce on the Adventure tab, so coins and a note are recorded.</div>`:''}
 ${G()?(a?(d.qty?.on?'':`<label>Reward when done: coins / exp</label><div class="row"><input type="number" min="0" step="any" value="${d.coins??5}" oninput="draft.coins=+this.value"><input type="number" min="0" step="any" value="${d.exp??10}" oninput="draft.exp=+this.value"></div>`):`<div class="row"><div><label>Coins per 1%</label><input type="number" min="0" step="any" value="${d.pcn??1}" oninput="draft.pcn=+this.value||0"></div><div><label>Exp per 1%</label><input type="number" min="0" step="any" value="${d.pxp??1}" oninput="draft.pxp=+this.value||0"></div></div><label>Completion bonus: coins / exp</label><div class="row"><input type="number" min="0" step="any" value="${d.coins??5}" oninput="draft.coins=+this.value"><input type="number" min="0" step="any" value="${d.exp??10}" oninput="draft.exp=+this.value"></div>`):''}
 <div class="row" style="margin-top:22px">${d.isNew?'':`<button class="btn d" onclick="delH()">Delete</button>`}<button class="btn g" onclick="cancelEd()">Cancel</button><button class="btn" onclick="saveH()">Save</button></div>`}
function timeSel(t){const h=t?+t.slice(0,2):null,m=t?t.slice(3,5):'00',h12=h==null?'':(h%12||12),ap=h!=null&&h>=12?'PM':'AM';
 const ms=[];for(let i=0;i<60;i+=5)ms.push(pad(i));if(!ms.includes(m))ms.push(m),ms.sort();
 const o=(v,c,l)=>`<option value="${v}" ${v==c?'selected':''}>${l??v}</option>`;
 return `<div class="row" style="flex-wrap:nowrap"><select id="tH" onchange="setTm()">${o('',h12,'--')}${Array.from({length:12},(_,i)=>o(i+1,h12)).join('')}</select><select id="tM" onchange="setTm()">${ms.map(v=>o(v,m)).join('')}</select><select id="tA" onchange="setTm()">${o('AM',ap)}${o('PM',ap)}</select></div>`}
function setTm(){const h=$('#tH').value;if(!h){draft.time='';return}draft.time=pad(+h%12+($('#tA').value=='PM'?12:0))+':'+$('#tM').value}
function setSt(k){draft.status=k;if(draft.type=='active'&&(k=='training'||k=='review')&&!draft.sched)draft.sched={mode:'daily',count:1};drawEd()}
function togTag(t){const a=draft.tags,i=a.indexOf(t);i<0?a.push(t):a.splice(i,1);drawEd()}
function togDay(i){const a=draft.sched.days=draft.sched.days||[],j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);drawEd()}
function pic(f,o,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,400,400);o.img=c.toDataURL('image/jpeg',.8);cb()};im.src=r.result};r.readAsDataURL(f)}
function saveH(){const d=draft;if(!d.name.trim())return toast('Give the habit a name');
 const old=get(d.id);if(live(d)&&(!old||!live(old)||old.type!=d.type)&&usedOf(d.type)>=slotsOf(d.type))return toast(slotMsg(d.type));
 if(!old||!live(old)||!old.since){if(live(d)&&!d.since)d.since=today()}
 if(d.sched?.mode=='every')d.sched.anchor=d.sched.anchor||today();
 if(d.sched?.mode=='days'&&!(d.sched.days||[]).length)return toast('Pick at least one day');
 delete d.isNew;if(d.type=='passive'){if(d.pcn==null)d.pcn=1;d.hist=d.hist||[]}if(old)Object.assign(old,d);else S.habits.push(d);save();closeM();render();toast('Saved')}

/* ---- import / export ---- */
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
const CC=['id','name','desc','img','type','status','tags','sched','time','pct','target','since','logs','qty','goal','comp','coins','exp','pxp','pcn'];
function exp(f){if(f=='json')return dl('questbits-'+today()+'.json',JSON.stringify(S,null,1),'application/json');
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=S.habits.map(h=>CC.map(c=>q(c=='tags'?(h.tags||[]).join(';'):['sched','logs','qty'].includes(c)?JSON.stringify(h[c]||{}):h[c])).join(','));
 dl('questbits-'+today()+'.csv',[CC.join(','),...rows].join('\n'),'text/csv')}
function parseCSV(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
 else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);R.push(r)}return R}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
